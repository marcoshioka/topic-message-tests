services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: pubsub-emulator
    command: >
      gcloud beta emulators pubsub start
      --project=pubsub-lab
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/v1/projects/pubsub-lab/topics || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
